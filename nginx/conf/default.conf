# HTTP 强制跳转 HTTPS
server {
    listen 80;
    server_name zerochat.top;

    # 包含证书申请时的验证路径（如果是用 certbot 申请的需要这个）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 配置
server {
    listen 443 ssl;
    listen [::]:443 ssl; # 同时支持 IPv6
    server_name zerochat.top;

    # 证书路径（确保已在 docker-compose 中挂载到这些位置）
    ssl_certificate /etc/nginx/ssl/zerochat.top_bundle.pem; 
    ssl_certificate_key /etc/nginx/ssl/zerochat.top.key;

    # SSL 性能与安全优化
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # 现代加密协议支持
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS 增强安全 (可选，初次调试建议先不加)
    # add_header Strict-Transport-Security "max-age=63072000" always;

    # 允许上传文件的大小限制（如果是聊天室，发图片或文件需要改大）
    client_max_body_size 50M;

    # 所有的接口请求和 WebSocket
    location / {
        # 这里的 app 是你在 docker-compose.yml 里的服务名
        proxy_pass http://zero-chat-app:3000; 

        # --- WebSocket 核心配置开始 ---
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade"; # 关键：告知后端协议升级
        # --- WebSocket 核心配置结束 ---

        # 基础 Header 转发
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 防止 WebSocket 连接因超时断开
        # 默认 60s，如果 60s 内没数据传输 Nginx 会断开，这里设为 1 小时
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # 解决代理缓冲导致的实时消息延迟
        proxy_buffering off;
    }
}