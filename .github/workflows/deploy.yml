name: Docker Production Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. 这一步是在 GitHub 自己的服务器上运行，网络绝对没问题
      # 我们直接把代码物理搬运到你的服务器，不走 git clone
      - name: Copy files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "./*"
          target: "/home/ubuntu/zero-chat"
          rm: true # 每次传输前清空目标文件夹，确保干净

      # 2. 文件搬过去后，只让服务器执行启动命令
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e
            cd /home/ubuntu/zero-chat

            # 自动兜底 Dockerfile，防止你本地没上传
            if [ ! -f "Dockerfile" ]; then
              cat <<EOF > Dockerfile
            FROM node:18-alpine
            WORKDIR /app
            COPY . .
            RUN [ -f package.json ] && npm install --production || echo "No package.json"
            CMD ["npm", "start"]
            EOF
            fi

            echo ">>> 正在启动 Docker..."
            sudo docker-compose up --build -d --remove-orphans
            sudo docker ps
