name: Docker Production Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. 搬运代码：rm 设为 false，绝对不准删除服务器原有文件
      - name: Copy files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "./*"
          target: "/home/ubuntu/zero-chat"
          rm: false # 核心：保护服务器上的 SSL 文件夹和 .env

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e
            cd /home/ubuntu/zero-chat

            echo ">>> [安全检查] 验证关键配置文件..."

            # 检查 SSL 文件夹
            if [ ! -d "ssl" ]; then
              echo "❌ 错误: SSL 证书文件夹丢失！请手动补回证书。"
              # 这里不退出，尝试让流程继续，但会提醒你
            fi

            # 检查 .env
            if [ ! -f ".env" ]; then
              echo "❌ 错误: .env 文件丢失！"
              exit 1
            fi

            # 自动补全 Dockerfile (仅在缺失时)
            if [ ! -f "Dockerfile" ]; then
              cat <<EOF > Dockerfile
            FROM node:18-alpine
            WORKDIR /app
            COPY . .
            RUN [ -f package.json ] && npm install --production || echo "No package.json"
            CMD ["npm", "start"]
            EOF
            fi

            echo ">>> [启动] 正在构建并重启容器..."
            sudo docker-compose up --build -d --remove-orphans

            echo ">>> [完成] 当前容器状态："
            sudo docker ps
