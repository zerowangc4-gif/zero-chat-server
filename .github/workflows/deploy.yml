name: Docker Production Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            # 1. 严格错误检查
            set -e

            # 2. 确保目录存在并进入
            PROJECT_DIR="/home/ubuntu/zero-chat"
            sudo mkdir -p $PROJECT_DIR
            sudo chown -R ${{ secrets.SERVER_USER }}:${{ secrets.SERVER_USER }} $PROJECT_DIR
            cd $PROJECT_DIR

            echo ">>> [1/4] 正在拉取代码..."

            # 3. 智能同步：如果是新目录就初始化，如果是旧目录就强制覆盖
            if [ ! -d ".git" ]; then
              git init
              git remote add origin https://github.com/${{ github.repository }}.git
            fi

            # 强制从 main 分支对齐代码
            git fetch origin main --depth=1
            git reset --hard origin/main

            # 4. 关键验证：确保 docker-compose.yml 真的躺在这里了
            if [ ! -f "docker-compose.yml" ]; then
              echo "❌ 错误：未发现 docker-compose.yml，请检查项目根目录！"
              exit 1
            fi

            echo ">>> [2/4] 正在构建并启动容器..."
            # 5. 执行部署
            # --remove-orphans 清理过时容器
            sudo docker-compose up --build -d --remove-orphans

            echo ">>> [3/4] 正在清理过期镜像..."
            sudo docker image prune -f

            echo ">>> [4/4] 部署成功！当前运行状态："
            sudo docker ps
