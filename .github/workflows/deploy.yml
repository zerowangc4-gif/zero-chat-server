name: Docker Production Deploy

on:
  push:
    branches: [main] # 确保你的默认分支确实叫 main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            # 1. 开启报错即停止模式
            set -e

            # 2. 定位并准备目录
            PROJECT_DIR="/home/ubuntu/zero-chat"
            echo ">>> [准备] 目标目录: $PROJECT_DIR"
            sudo mkdir -p $PROJECT_DIR
            sudo chown -R ${{ secrets.SERVER_USER }}:${{ secrets.SERVER_USER }} $PROJECT_DIR
            cd $PROJECT_DIR

            # 3. 核心代码同步逻辑：强制对齐远程仓库
            echo ">>> [1/4] 正在拉取代码..."

            # 初始化 Git（如果目录还不是 git 仓库）
            if [ ! -d ".git" ]; then
              git init
            fi

            # 强行重置远程关联，防止报错 "origin already exists" 或关联错误
            git remote remove origin || true
            git remote add origin https://github.com/zerowangc4-gif/zero-chat-server.git

            # 强制抓取并覆盖本地（解决所有文件冲突）
            git fetch origin main --depth=1
            git reset --hard origin/main

            # 4. 关键文件物理检查
            echo ">>> [2/4] 验证部署环境..."
            if [ ! -f "docker-compose.yml" ]; then
              echo "❌ 致命错误：在 $PROJECT_DIR 下未找到 docker-compose.yml"
              ls -al
              exit 1
            fi

            # 5. 重启 Docker 容器
            echo ">>> [3/4] 正在启动 Docker 服务..."
            # 停止可能存在的旧容器，并重新构建启动
            sudo docker-compose up --build -d --remove-orphans

            # 6. 清理冗余
            echo ">>> [4/4] 正在清理虚悬镜像..."
            sudo docker image prune -f

            echo ">>> [部署完成] 最终状态如下："
            sudo docker ps
