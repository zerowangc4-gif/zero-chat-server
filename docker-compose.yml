services:
  redis:
    image: redis:alpine
    restart: always
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD}",
        "--appendonly",
        "yes",
        "--appendfsync",
        "always",
        "--aof-rewrite-incremental-fsync",
        "yes",
        "--maxmemory-policy",
        "noeviction",
      ]
    volumes:
      - ./data/redis:/data
    networks:
      - zero-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  zero-chat-app:
    build: .
    restart: always
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - zero-network

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - zero-chat-app
    networks:
      - zero-network

networks:
  zero-network:
    driver: bridge
