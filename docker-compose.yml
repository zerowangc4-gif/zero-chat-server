name: Docker Production Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          # 关键修改：增加 set -e 保证一旦报错立刻停止并反馈给 GitHub
          script: |
            set -e

            # 1. 进入并确保目录存在
            mkdir -p /home/ubuntu/zero-chat
            cd /home/ubuntu/zero-chat

            # 2. 处理 Git 初始化逻辑（解决目录不为空导致 clone 失败的问题）
            if [ ! -d ".git" ]; then
              echo ">>> 目录未初始化，正在启动强力同步..."
              git init
              git remote add origin https://github.com/${{ github.repository }}.git
            fi

            # 3. 强力拉取：无视本地差异，强制对齐 GitHub 代码
            # 这样即使你手动改了服务器文件，也会被 GitHub 的 main 分支覆盖（.env 除外）
            echo ">>> 正在同步远程代码..."
            git fetch origin main
            git reset --hard origin/main

            # 4. 验证关键文件是否存在
            if [ ! -f "docker-compose.yml" ]; then
              echo "错误：未能在服务器找到 docker-compose.yml"
              exit 1
            fi

            # 5. 部署容器
            echo ">>> 正在启动 Docker 容器集群..."
            sudo docker-compose up --build -d

            # 6. 状态检查（确保容器真的 Up 了）
            echo ">>> 正在验证服务状态..."
            sudo docker ps
