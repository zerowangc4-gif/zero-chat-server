script: |
  # 1. 开启“报错即停止”和“命令回显”模式
  set -e
  set -x

  # 2. 强制进入正确目录
  cd /home/ubuntu/zero-chat

  # 3. 彻底重置 Git 环境（防止之前的错误状态残留）
  rm -rf .git  # 删掉旧的 git 记录，从头再来
  git init
  git remote add origin https://github.com/${{ github.repository }}.git

  echo ">>> 正在执行暴力同步..."
  # 这一步如果拉不下来，CI 绝对会变红报错，不会再给你绿灯
  git fetch --all --depth=1
  git reset --hard origin/main

  echo ">>> 严重检查：同步后的文件清单"
  ls -al  # 如果这里还没看到 docker-compose.yml，说明 GitHub 连不上你的服务器

  echo ">>> 正在尝试启动 Docker"
  # 不加 -d 运行 10 秒看报错，然后再转后台
  sudo docker-compose up --build -d

  echo ">>> 部署最终检查"
  sudo docker ps -a
