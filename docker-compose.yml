script: |
  set -e

  # 1. 进入项目目录（确保路径绝对正确）
  PROJECT_DIR="/home/ubuntu/zero-chat"
  mkdir -p $PROJECT_DIR
  cd $PROJECT_DIR

  # 2. 强力初始化和同步
  echo ">>> [STEP 1/3] 正在建立 Git 关联..."
  if [ ! -d ".git" ]; then
    git init
    # 使用 https 地址（如果是私有仓库建议通过 SSH 连结，目前假设是公共或已授权）
    git remote add origin https://github.com/${{ github.repository }}.git || true
  else
    # 确保 remote 地址是最新的
    git remote set-url origin https://github.com/${{ github.repository }}.git
  fi

  echo ">>> [STEP 2/3] 正在强制拉取 GitHub 最新代码..."
  # --force 确保强制覆盖，--prune 清理掉远程已删除的分支
  git fetch --all --force
  # 放弃服务器上所有未提交的改动，强制对齐 main 分支
  git reset --hard origin/main

  # 3. 核心验证：列出文件列表，让你在 GitHub 日志里能看到
  echo ">>> [VERIFY] 验证代码是否拉取成功。当前目录文件列表："
  ls -F

  if [ ! -f "docker-compose.yml" ]; then
    echo "!!! 致命错误：代码拉取失败，未发现 docker-compose.yml"
    exit 1
  fi

  # 4. 执行部署
  echo ">>> [STEP 3/3] 正在启动 Docker 容器..."
  # 确保使用 sudo
  sudo docker-compose up --build -d

  # 5. 最终检查
  echo ">>> 部署任务结束。当前正在运行的服务："
  sudo docker ps
