name: Docker Production Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            # 1. 设置严格错误检查：任何命令失败立即终止
            set -e

            # 2. 定义绝对路径，避免路径歧义
            TARGET_DIR="/home/ubuntu/zero-chat"

            # 3. 确保目录存在并进入
            sudo mkdir -p $TARGET_DIR
            sudo chown -R ${{ secrets.SERVER_USER }}:${{ secrets.SERVER_USER }} $TARGET_DIR
            cd $TARGET_DIR

            echo ">>> [STEP 1] 开始同步代码到 $TARGET_DIR"

            # 4. 彻底重置 Git：删掉旧的，重新初始化，解决目录不为空的问题
            [ -d ".git" ] || git init
            git remote remove origin || true
            git remote add origin https://github.com/${{ github.repository }}.git

            # 5. 暴力同步：强制覆盖本地所有内容
            git fetch origin main --depth=1
            git reset --hard origin/main

            # 6. 【核心校验】如果这里失败，CI 会直接显示红叉，绝不骗你
            echo ">>> [STEP 2] 验证关键文件..."
            if [ ! -f "docker-compose.yml" ]; then
              echo "FATAL ERROR: docker-compose.yml not found after sync!"
              ls -la
              exit 1
            fi

            # 7. 启动服务
            echo ">>> [STEP 3] 重启容器服务..."
            # 使用 sudo 确保权限，-f 指定文件确保万无一失
            sudo docker-compose -f docker-compose.yml up --build -d

            # 8. 打印运行状态供你直接在 GitHub 日志查看
            echo ">>> [STEP 4] 当前运行中的容器："
            sudo docker ps
