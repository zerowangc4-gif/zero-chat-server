script: |
  # 1. 进入目录并打印当前绝对路径（确保我们没走错房间）
  cd /home/ubuntu/zero-chat
  echo "--- [CHECK 1] 当前绝对路径: $(pwd) ---"

  # 2. 强制清理并重新拉取（抛弃所有缓存和干扰）
  echo "--- [CHECK 2] 开始强制清理 Git 状态 ---"
  sudo rm -rf .git
  git init
  git remote add origin https://github.com/${{ github.repository }}.git

  echo "--- [CHECK 3] 正在拉取代码... ---"
  # 这一步如果失败，脚本会报错
  git fetch origin main --depth=1
  git reset --hard origin/main

  echo "--- [CHECK 4] 拉取后的文件清单 (必须有 docker-compose.yml) ---"
  ls -al

  # 3. 强制重启 Docker
  echo "--- [CHECK 5] 正在执行 Docker 重启 ---"
  # 这里如果不成功，会显示具体错误（如端口占用、yml 语法错误）
  sudo docker-compose down || true
  sudo docker-compose up --build -d

  echo "--- [CHECK 6] 最终运行中的容器 ---"
  sudo docker ps
