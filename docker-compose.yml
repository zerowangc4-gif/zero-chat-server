version: "3.8"
services:
  mysql:
    image: mysql:8.0
    container_name: zero-chat-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_NAME}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - ./data/mysql:/var/lib/mysql
    networks:
      - zero-network

  redis:
    image: redis:alpine
    container_name: zero-chat-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - ./data/redis:/data
    networks:
      - zero-network

  zero-chat-app:
    build: .
    container_name: zero-chat-app
    restart: always
    env_file: .env
    environment:
      TZ: Asia/Shanghai
    depends_on:
      - mysql
      - redis
    networks:
      - zero-network

  nginx:
    image: nginx:alpine
    container_name: zero-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - zero-chat-app
    networks:
      - zero-network

networks:
  zero-network:
    driver: bridge
