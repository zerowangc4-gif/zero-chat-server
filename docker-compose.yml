version: "3.8"
services:
  mysql:
    image: mysql:8.0
    container_name: zero-mysql
    restart: always
    environment:
      # 这里使用 ${} 引用 .env 中的变量
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - ./data/mysql:/var/lib/mysql
    networks:
      - zero-network

  redis:
    image: redis:alpine
    container_name: zero-redis
    restart: always
    # 增加这行来为 Redis 设置密码
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks:
      - zero-network

  app:
    build: .
    container_name: zero-chat-app
    restart: always
    # 这一行必不可少，否则 Node 拿不到 .env 里的密码
    env_file: .env
    depends_on:
      - mysql
      - redis
    networks:
      - zero-network

  nginx:
    image: nginx:alpine
    container_name: zero-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - zero-network

networks:
  zero-network:
    driver: bridge
