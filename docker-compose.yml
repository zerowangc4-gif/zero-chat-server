script: |
  set -e  # 遇到错误立即停止

  # 1. 确保目录存在并进入
  mkdir -p /home/ubuntu/zero-chat
  cd /home/ubuntu/zero-chat

  # 2. 强力同步代码 (核心修改)
  if [ ! -d ".git" ]; then
    echo ">>> 正在初始化 Git 并关联远程仓库..."
    git init
    git remote add origin https://github.com/${{ github.repository }}.git
  fi

  echo ">>> 正在强制对齐 GitHub 最新代码..."
  git fetch origin main
  # reset --hard 会强制把 GitHub 的文件“盖”在当前目录上，不会报“目录非空”的错
  git reset --hard origin/main

  # 3. 验证文件
  echo ">>> 检查同步结果 (ls -al):"
  ls -al

  # 4. 部署容器
  echo ">>> 正在启动 Docker 容器集群..."
  sudo docker-compose up --build -d

  # 5. 清理镜像
  sudo docker image prune -f
