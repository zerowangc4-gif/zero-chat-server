script: |
  # 开启详细模式，打印每一行执行的命令
  set -x

  PROJECT_DIR="/home/ubuntu/zero-chat"
  mkdir -p $PROJECT_DIR
  cd $PROJECT_DIR

  echo ">>> 1. 检查当前环境"
  git --version || echo "Git 未安装"
  docker-compose --version || echo "Docker Compose 未安装"

  echo ">>> 2. 强制同步代码"
  # 如果没有 .git 文件夹则初始化
  [ ! -d ".git" ] && git init

  # 重新关联远程仓库（确保地址动态更新）
  git remote remove origin || true
  git remote add origin https://github.com/${{ github.repository }}.git

  # 尝试拉取，如果 main 不行就试 master
  echo ">>> 正在拉取..."
  git fetch origin
  git reset --hard origin/main || git reset --hard origin/master

  echo ">>> 3. 验证目录内容"
  ls -al

  echo ">>> 4. 尝试启动 Docker"
  # 这里不加 -d，如果有报错会直接显示在 GitHub 日志里
  sudo docker-compose up --build -d || (echo "Docker 启动失败" && exit 1)

  echo ">>> 5. 最终容器状态"
  sudo docker ps -a
