version: "3.8"
services:
  mysql:
    image: mysql:8.0
    container_name: zero-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      TZ: Asia/Shanghai
    volumes:
      - ./data/mysql:/var/lib/mysql
    networks:
      - zero-network

  redis:
    image: redis:alpine
    container_name: zero-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - ./data/redis:/data
    networks:
      - zero-network

  # --- 修改这里：服务名改为 zero-chat-app ---
  zero-chat-app:
    build: .
    container_name: zero-chat-app
    restart: always
    env_file: .env
    environment:
      TZ: Asia/Shanghai
    depends_on:
      - mysql
      - redis
    networks:
      - zero-network

  nginx:
    image: nginx:alpine
    container_name: zero-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # 确保你本地有 nginx/conf 文件夹，且 default.conf 在里面
      - ./nginx/conf/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      # 对应 Nginx 配置中的 certbot 路径
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - zero-chat-app
    networks:
      - zero-network

networks:
  zero-network:
    driver: bridge
